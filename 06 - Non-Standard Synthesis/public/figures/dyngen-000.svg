<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="940" height="380" font-family="Avenir Next, Avenir, Helvetica Neue, Helvetica, Arial, sans-serif" fill="#141414">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#141414"/></marker></defs>
<text x="186" y="108" text-anchor="end" font-size="15" fill="#141414" font-weight="600">the usual way</text>
<rect x="206" y="72" width="190" height="62" rx="4" fill="none" stroke="#141414" stroke-width="1.8"/>
<text x="301" y="99" text-anchor="middle" font-size="15" fill="#141414" font-weight="600">SynthDef</text>
<text x="301" y="119" text-anchor="middle" font-size="12" fill="#555">a graph of UGens</text>
<path d="M396 103 L462 103" fill="none" stroke="#141414" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="470" y="72" width="200" height="62" rx="4" fill="none" stroke="#141414" stroke-width="1.8"/>
<text x="570" y="99" text-anchor="middle" font-size="15" fill="#141414" font-weight="600">scsynth</text>
<text x="570" y="119" text-anchor="middle" font-size="12" fill="#555">each UGen fills</text>
<path d="M670 103 L740 103" fill="none" stroke="#141414" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="748" y="72" width="150" height="62" rx="4" fill="none" stroke="#141414" stroke-width="1.8"/>
<text x="823" y="99" text-anchor="middle" font-size="15" fill="#141414" font-weight="600">output</text>
<text x="823" y="119" text-anchor="middle" font-size="12" fill="#555">a block of samples</text>
<text x="186" y="252" text-anchor="end" font-size="15" fill="#141414" font-weight="600">DynGen</text>
<rect x="206" y="216" width="190" height="62" rx="4" fill="none" stroke="#141414" stroke-width="1.8"/>
<text x="301" y="243" text-anchor="middle" font-size="15" fill="#141414" font-weight="600">DynGenDef</text>
<text x="301" y="263" text-anchor="middle" font-size="12" fill="#555">a string of EEL2</text>
<path d="M396 247 L462 247" fill="none" stroke="#141414" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="470" y="216" width="200" height="62" rx="4" fill="none" stroke="#141414" stroke-width="1.8"/>
<text x="570" y="243" text-anchor="middle" font-size="15" fill="#141414" font-weight="600">a VM on the server</text>
<text x="570" y="263" text-anchor="middle" font-size="12" fill="#555">compiles it</text>
<path d="M670 247 L740 247" fill="none" stroke="#141414" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="748" y="216" width="150" height="62" rx="4" fill="none" stroke="#141414" stroke-width="1.8"/>
<text x="823" y="243" text-anchor="middle" font-size="15" fill="#141414" font-weight="600">output</text>
<text x="823" y="263" text-anchor="middle" font-size="12" fill="#555">one sample at a time</text>
<path d="M60 172 H880" stroke="#a8a8a8" stroke-width="1"/>
<text x="470" y="316" text-anchor="middle" font-size="14" fill="#555" font-style="italic">the code is a string, so it can be written, stored or generated by another program</text>
<text x="470" y="344" text-anchor="middle" font-size="15" fill="#141414" font-weight="600">single-sample operations, which is what the lineage in this class was doing offline</text>
</svg>