<rect x="556.0" y="140.0" width="300.0" height="58.0" rx="4" fill="none" stroke="#141414" stroke-width="1.7"/>
<text x="572.0" y="164.0" text-anchor="start" font-size="15" fill="#141414" font-family="Avenir Next, Avenir, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="600">glisson</text>
<text x="660.0" y="162.0" text-anchor="start" font-size="13" fill="#555" font-family="Avenir Next, Avenir, Helvetica Neue, Helvetica, Arial, sans-serif">a waveform that</text>
<text x="660.0" y="180.0" text-anchor="start" font-size="13" fill="#555" font-family="Avenir Next, Avenir, Helvetica Neue, Helvetica, Arial, sans-serif">glides while it sounds</text>
