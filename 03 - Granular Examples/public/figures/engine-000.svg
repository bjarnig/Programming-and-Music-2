<rect x="336.0" y="108.0" width="150.0" height="68.0" rx="4" fill="none" stroke="#141414" stroke-width="2.4"/>
<text x="411.0" y="138.0" text-anchor="middle" font-size="16" fill="#141414" font-family="Avenir Next, Avenir, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="600">emitter</text>
<text x="411.0" y="160.0" text-anchor="middle" font-size="12" fill="#555" font-family="Avenir Next, Avenir, Helvetica Neue, Helvetica, Arial, sans-serif">one particle,</text>
<text x="411.0" y="174.0" text-anchor="middle" font-size="12" fill="#555" font-family="Avenir Next, Avenir, Helvetica Neue, Helvetica, Arial, sans-serif">then the next</text>
