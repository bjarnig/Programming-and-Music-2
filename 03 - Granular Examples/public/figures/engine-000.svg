<text x="166.0" y="152.0" text-anchor="middle" font-size="14" fill="#555" font-family="Menlo, Monaco, Consolas, monospace">envelope</text>
<text x="166.0" y="174.0" text-anchor="middle" font-size="14" fill="#555" font-family="Menlo, Monaco, Consolas, monospace">amplitude</text>
<text x="166.0" y="196.0" text-anchor="middle" font-size="14" fill="#555" font-family="Menlo, Monaco, Consolas, monospace">pan</text>
